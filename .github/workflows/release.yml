name: Release Desktop

# Construit les binaires Desktop (arm64 + x64) et les attache à la Release
# GitHub correspondant au tag poussé (ex : v0.1.0). La modale du site pointe
# vers releases/latest/download — les liens deviennent actifs dès la fin du job.
#
# Installers propres par OS :
#  - Windows : NSIS (Castor-Windows-<arch>-setup.exe) — désinstalleur intégré
#    (« Applications installées »), raccourcis bureau + menu démarrer
#  - macOS : DMG glisser-déposer (Castor-macOS-<arch>.dmg) + zip portable ;
#    désinstallation via scripts/uninstall-macos.sh
#  - Linux : .deb (apt remove castor-desktop) + AppImage portable + tar.gz

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # runner Apple Silicon natif (cross-build x64 ok)
            platform: mac
            args: --mac --arm64 --x64
          - os: windows-latest
            platform: win
            args: --win --arm64 --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installation des dépendances
        working-directory: desktop
        run: npm ci

      # desktop/build/ est ignoré par git : l'icône est régénérée ici
      # (icon.icns via iconutil sur macOS, icon.png/icon.ico partout)
      - name: Génération de l'icône
        working-directory: desktop
        run: python3 scripts/gen-icon.py

      - name: Build ${{ matrix.platform }} (arm64 + x64)
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload vers la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/Castor-*.zip
            desktop/release/Castor-*.dmg
            desktop/release/Castor-*.exe
            desktop/release/Castor-*.AppImage
            desktop/release/*.deb
            desktop/release/Castor-*.tar.gz
            desktop/release/latest*.yml
