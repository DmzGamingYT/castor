name: Release Desktop

# Construit les binaires Desktop (arm64) et les attache à la Release GitHub
# correspondant au tag poussé (ex : v0.1.0). La modale du site pointe vers
# releases/latest/download — les liens deviennent actifs dès la fin du job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # runner Apple Silicon natif
            platform: mac
            artifact: Castor-macOS-arm64.zip
          - os: windows-latest
            platform: win
            artifact: Castor-Windows-arm64-portable.zip
          - os: ubuntu-latest
            platform: linux
            artifact: Castor-Linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installation des dépendances
        working-directory: desktop
        run: npm ci

      - name: Build ${{ matrix.platform }} arm64
        working-directory: desktop
        run: npx electron-builder --${{ matrix.platform }} --arm64 --publish never

      - name: Upload vers la Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/${{ matrix.artifact }}
