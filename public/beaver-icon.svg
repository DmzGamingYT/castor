<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c666"/>
      <stop offset="100%" stop-color="#e2952a"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3d0e"/>
      <stop offset="100%" stop-color="#3d2808"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f5edd6"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a04"/>
      <stop offset="100%" stop-color="#1a0f02"/>
    </linearGradient>
  </defs>
  
  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Tail (behind body) -->
  <ellipse cx="92" cy="88" rx="22" ry="11" fill="#3d2808" transform="rotate(-18 92 88)"/>
  <ellipse cx="92" cy="88" rx="20" ry="9.5" fill="#4a3210" transform="rotate(-18 92 88)"/>
  <!-- Tail texture lines -->
  <line x1="78" y1="84" x2="106" y2="80" stroke="#3d2808" stroke-width="0.8" opacity="0.5" transform="rotate(-18 92 88)"/>
  <line x1="76" y1="88" x2="108" y2="84" stroke="#3d2808" stroke-width="0.8" opacity="0.4" transform="rotate(-18 92 88)"/>
  <line x1="78" y1="92" x2="106" y2="88" stroke="#3d2808" stroke-width="0.8" opacity="0.3" transform="rotate(-18 92 88)"/>
  
  <!-- Body -->
  <ellipse cx="62" cy="82" rx="28" ry="22" fill="url(#fur)"/>
  
  <!-- Belly patch -->
  <ellipse cx="58" cy="85" rx="16" ry="14" fill="url(#belly)" opacity="0.9"/>
  
  <!-- Left arm -->
  <ellipse cx="38" cy="78" rx="8" ry="6" fill="#4a3210" transform="rotate(-15 38 78)"/>
  
  <!-- Right arm (waving) -->
  <ellipse cx="84" cy="72" rx="8" ry="6" fill="#4a3210" transform="rotate(25 84 72)"/>
  
  <!-- Head -->
  <circle cx="60" cy="52" r="24" fill="url(#fur)"/>
  
  <!-- Left ear -->
  <circle cx="40" cy="34" r="8" fill="#4a3210"/>
  <circle cx="40" cy="34" r="5" fill="#c98820" opacity="0.6"/>
  
  <!-- Right ear -->
  <circle cx="78" cy="34" r="8" fill="#4a3210"/>
  <circle cx="78" cy="34" r="5" fill="#c98820" opacity="0.6"/>
  
  <!-- Face lighter area -->
  <ellipse cx="60" cy="56" rx="18" ry="16" fill="#5c3d0e" opacity="0.3"/>
  
  <!-- Eyes - white -->
  <ellipse cx="50" cy="48" rx="6.5" ry="7" fill="#fffdf6"/>
  <ellipse cx="70" cy="48" rx="6.5" ry="7" fill="#fffdf6"/>
  
  <!-- Eyes - iris -->
  <circle cx="51.5" cy="48.5" r="4" fill="#1a0f02"/>
  <circle cx="71.5" cy="48.5" r="4" fill="#1a0f02"/>
  
  <!-- Eyes - pupil highlight -->
  <circle cx="53" cy="47" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="73" cy="47" r="1.5" fill="#fff" opacity="0.9"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="57" rx="4.5" ry="3.5" fill="url(#nose)"/>
  <ellipse cx="60" cy="56.5" rx="2" ry="1" fill="#fff" opacity="0.2"/>
  
  <!-- Mouth -->
  <path d="M55 61 Q60 65 65 61" fill="none" stroke="#1a0f02" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Teeth -->
  <rect x="56.5" y="61" width="4" height="5.5" rx="1.5" fill="#fffdf6"/>
  <rect x="61" y="61" width="4" height="5.5" rx="1.5" fill="#fffdf6"/>
  <line x1="58.5" y1="61" x2="58.5" y2="66" stroke="#e8e0cc" stroke-width="0.5"/>
  <line x1="63" y1="61" x2="63" y2="66" stroke="#e8e0cc" stroke-width="0.5"/>
  
  <!-- Whiskers -->
  <g stroke="#fffdf6" stroke-width="0.8" opacity="0.5" stroke-linecap="round">
    <line x1="36" y1="54" x2="48" y2="56"/>
    <line x1="35" y1="58" x2="48" y2="58"/>
    <line x1="36" y1="62" x2="48" y2="60"/>
    <line x1="72" y1="56" x2="84" y2="54"/>
    <line x1="72" y1="58" x2="84" y2="58"/>
    <line x1="72" y1="60" x2="84" y2="62"/>
  </g>
  
  <!-- Cheek blush -->
  <circle cx="42" cy="58" r="4" fill="#e2952a" opacity="0.35"/>
  <circle cx="78" cy="58" r="4" fill="#e2952a" opacity="0.35"/>
</svg>
