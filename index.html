    <!-- applique le thème avant le premier rendu pour éviter le flash -->
    <script>
      try {
        var t = localStorage.getItem("castor-theme");
        if (t !== "dark" && t !== "light") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
