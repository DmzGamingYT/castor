    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai https://api.github.com https://raw.githubusercontent.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />

    <!-- mode clair unique : le site reste en thème jour en permanence -->
    <script>
      document.documentElement.dataset.theme = "light";
      /* barre du navigateur mobile alignée sur le thème clair */
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.content = "#faf6ec";
    </script>

    <!-- Structured Data — Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Castor Desktop",
          "description": "Agent de code gratuit et multi-providers : Desktop, CLI, studio Web et Chat. Donne-lui un chantier, il construit.",
          "url": "https://dmzgamingyt.github.io/castor/",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "macOS, Windows, Linux",
          /* version du site — à synchroniser avec src/lib/version.js */
          "softwareVersion": "0.2.0",
          "license": "https://opensource.org/licenses/MIT",
          "author": {
            "@type": "Person",
            "name": "DmzGamingYT"
          },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR",
            "availability": "https://schema.org/InStock",
            "url": "https://dmzgamingyt.github.io/castor/"
          },
          "featureList": [
            "Agents parallèles",
            "Multi-providers (OpenRouter, Groq, OpenCode Zen, Ollama, LM Studio)",
            "Clés API chiffrées via safeStorage",
            "Streaming token par token",
            "Thème clair et sombre",
            "Interface Web de génération de sites",
            "Chat IA avec recherche web et mode réflexion",
            "CLI avec conscience de repo et diffs lisibles",
            "100 % gratuit, open source MIT"
          ],
          "screenshot": "https://dmzgamingyt.github.io/castor/og-image.png",
          "downloadUrl": "https://github.com/DmzGamingYT/castor/releases/latest"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Comment peut-il être gratuit ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Le projet est open source (licence MIT) et tourne sur ta machine ou ton navigateur. Côté IA, les studios passent par le tier gratuit d'OpenRouter avec ta propre clé : aucun serveur à financer, donc aucun abonnement. Pas de publicité, pas de revente de données."
              }
            },
            {
              "@type": "Question",
              "name": "Quels modèles puis-je utiliser ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ceux que tu branches : Ox Alpha, Nemotron, Laguna et les autres gratuits via OpenRouter, Groq pour l'inférence ultra-rapide, OpenCode Zen pour le code, ou tes propres modèles locaux via Ollama et LM Studio."
              }
            },
            {
              "@type": "Question",
              "name": "Mes données sont-elles collectées ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Non. Tes conversations et tes projets sont stockés uniquement dans ton navigateur (localStorage). Ta clé API aussi. Rien ne transite vers nos serveurs — il n'y en a pas : tes requêtes vont directement du navigateur au provider que tu as choisi."
              }
            },
            {
              "@type": "Question",
              "name": "Dans quels pays est-ce disponible ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Partout où il y a internet : tout tourne chez toi, il n'y a rien à débloquer. Seule dépendance : la disponibilité des providers de modèles depuis ton pays (OpenRouter, Groq…)."
              }
            },
            {
              "@type": "Question",
              "name": "Pourquoi créer une clé OpenRouter ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Elle donne accès aux modèles gratuits du Castor Bot (mode IA). Elle se crée en 30 secondes sur openrouter.ai, se colle une seule fois dans l'app et reste dans ton navigateur. Sans clé, le Castor Bot reste utilisable en mode local."
              }
            }
          ]
        }
      ]
    }
    </script>
